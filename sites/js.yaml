id: js
name: 江苏省公共资源交易平台
enabled: true
type: json
method: POST
url: https://jsggzy.jszwfw.gov.cn/inteligentsearch/rest/esinteligentsearch/getFullTextDataNew
referer: https://jsggzy.jszwfw.gov.cn/jyxx/tradeInfonew.html
headers:
  Referer: https://jsggzy.jszwfw.gov.cn/jyxx/tradeInfonew.html
  Content-Type: application/json;charset=utf-8
min_interval: 1.2
page_start: 0
page_size: 10
max_pages: 10
body:
  token: ""
  pn: "${pn}"
  rn: "${page_size}"
  sdt: ""
  edt: ""
  wd: "${keyword}"
  inc_wd: ""
  exc_wd: ""
  fields: "title;zhuanzainew;categorynum;zhuanzai;webdate"
  cnum: "001"
  sort: '{"infodatepx":"0"}'
  ssort: title
  cl: 200
  terminal: ""
  condition: null
  time:
    - fieldName: infodatepx
      startTime: "${start}"
      endTime: "${end}"
  highlights: title
  statistics: null
  unionCondition: null
  opCondition: null
  opType: 0
  accuracy: ""
  noParticiple: "1"
  searchRange: null
  isBusiness: "1"
list_path: result.records
total_path: result.totalcount
fields:
  external_id: infoid
  title: titlenew
  publish_date: infodatepx
  region: fieldvalue
  category: categoryname
  content: content
  attachments: attachname
  url_template: "https://jsggzy.jszwfw.gov.cn{linkurl}"
