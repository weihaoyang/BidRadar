[project]
name = "bidradar"
version = "0.1.0"
description = "BidRadar - 招投标数据获取 CLI + MCP（中国 + 海外公开源）"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "mcp>=1.2",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
]

[project.scripts]
bidradar = "bidradar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bidradar"]
